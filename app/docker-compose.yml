name: moneygraph

services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - moneygraph-data:/data
    mem_limit: ${MG_BACKEND_MEMORY:-8g}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${MG_HTTP_BIND:-127.0.0.1}:${MG_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  moneygraph-data:
