[project]
name = "moneygraph"
version = "0.1.0"
description = "Граф денег: роли, кластеры и приоритеты в сети внутрибанковских переводов (HackAlem AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.4",
    "numpy>=1.26",
    "openai>=1.60",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "python-igraph>=1.0.0",
    "scipy>=1.13",
]

[project.scripts]
moneygraph = "moneygraph.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"
